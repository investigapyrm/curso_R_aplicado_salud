    const NAV = [
      ['inicio', 'Inicio'],
      ['ruta', 'Ruta del curso'],
      ['unidades', 'Unidades'],
      ['actividades', 'Actividades'],

      ['ayuda', 'Ayuda']
    ];

    const session = JSON.parse(sessionStorage.getItem('rSaludSession') || 'null');
    if (!session) window.location.href = 'index.html';

    const storageKey = `rSaludProgress:${session?.usuario || 'anon'}`;
    const defaultProgress = {
      checks: {},
      quizResults: {},
      rpubsUrl: '',
      notes: ''
    };
    let progress = loadProgress();

    function loadProgress() {
      try {
        return { ...defaultProgress, ...JSON.parse(localStorage.getItem(storageKey) || '{}') };
      } catch (error) {
        return { ...defaultProgress };
      }
    }

    function saveProgress() {
      localStorage.setItem(storageKey, JSON.stringify(progress));
      renderStats();
      renderProgress();
    }

    function getAllCheckIds() {
      return COURSE.units.flatMap(unit => [
        `u${unit.id}_material`,
        `u${unit.id}_actividad`,
        `u${unit.id}_tarea`,
        `u${unit.id}_quiz`
      ]);
    }

    function percentComplete() {
      const ids = getAllCheckIds();
      const done = ids.filter(id => progress.checks[id]).length;
      return Math.round((done / ids.length) * 100);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function initNavigation() {
      const nav = document.getElementById('navList');
      const mobile = document.getElementById('mobileSelect');
      nav.innerHTML = '';
      mobile.innerHTML = '';

      NAV.forEach(([id, label]) => {
        if (id === 'administracion' && !['docente', 'admin'].includes(session.rol)) return;

        const btn = document.createElement('button');
        btn.className = 'nav-btn';
        btn.type = 'button';
        btn.dataset.target = id;
        btn.innerHTML = `<span class="nav-mark"></span><span>${label}</span>`;
        btn.addEventListener('click', () => showSection(id));
        nav.appendChild(btn);

        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = label;
        mobile.appendChild(opt);
      });

      mobile.addEventListener('change', event => showSection(event.target.value));
    }

    function showSection(id) {
      if (!document.getElementById(id)) id = 'inicio';
      document.querySelectorAll('.section').forEach(section => section.classList.toggle('active', section.id === id));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.target === id));
      document.getElementById('mobileSelect').value = id;
      const section = document.getElementById(id);
      document.getElementById('pageTitle').textContent = section.dataset.title;
      document.getElementById('pageSubtitle').textContent = section.dataset.subtitle;
      location.hash = id;
    }

    function renderStats() {
      const complete = percentComplete();
      const quizScores = Object.values(progress.quizResults).map(result => result.score);
      const quizAvg = quizScores.length ? Math.round(quizScores.reduce((a, b) => a + b, 0) / quizScores.length) : 0;
      const stats = document.getElementById('statsGrid');
      if (!stats) return;
      stats.innerHTML = `
        <div class="stat-card"><span>Avance total</span><strong>${complete}%</strong></div>
        <div class="stat-card"><span>Unidades</span><strong>${COURSE.units.length}</strong></div>
        <div class="stat-card"><span>Quizzes rendidos</span><strong>${quizScores.length}/6</strong></div>
        <div class="stat-card"><span>Promedio quiz</span><strong>${quizAvg}%</strong></div>
      `;
      document.getElementById('overallProgress').style.width = `${complete}%`;
      document.getElementById('overallProgressLabel').textContent = `${complete}% completado`;
    }

    function bindChecks() {
      document.querySelectorAll('[data-check]').forEach(input => {
        input.checked = Boolean(progress.checks[input.dataset.check]);

    function renderQuizzes() {
      document.getElementById('cuestionarios').innerHTML = `
        <div class="grid two">
          ${COURSE.units.map(unit => {
            const result = progress.quizResults[`u${unit.id}`];
            return `
              <article class="quiz-card" id="quizCard${unit.id}">

                </div>
                <button class="btn small" type="button" onclick="startQuiz(${unit.id})">Iniciar quiz</button>
                <div id="quizMount${unit.id}"></div>
              </article>
            `;
          }).join('')}
        </div>
      `;
    }

    async function startQuiz(unitId) {
      const mount = document.getElementById(`quizMount${unitId}`);
      mount.innerHTML = '<div class="status-box">Cargando preguntas...</div>';
      try {
        const response = await fetch(`data/quizzes/quiz_u${unitId}.json`, { cache: 'no-store' });
        if (!response.ok) throw new Error('No se pudo cargar el cuestionario');
        const quiz = await response.json();
        mount.innerHTML = `
          <form id="quizForm${unitId}">
            ${quiz.preguntas.map((question, qIndex) => `
              <fieldset class="panel" style="box-shadow:none;margin-top:14px">
                <legend><strong>${qIndex + 1}. ${question.texto}</strong></legend>
                <div class="quiz-options">
                  ${question.opciones.map((option, oIndex) => `
                    <label>
                      <input type="radio" name="q${qIndex}" value="${oIndex}" required>
                      <span>${option}</span>
                    </label>
                  `).join('')}
                </div>
              </fieldset>
            `).join('')}
            <button class="btn small" type="submit">Corregir</button>
          </form>
          <div class="quiz-feedback" id="quizFeedback${unitId}"></div>
        `;

        document.getElementById(`quizForm${unitId}`).addEventListener('submit', event => {
          event.preventDefault();
          let correct = 0;
          const explanations = quiz.preguntas.map((question, qIndex) => {
            const selected = Number(new FormData(event.target).get(`q${qIndex}`));
            const ok = selected === question.correcta;
            if (ok) correct += 1;
            return `<li><strong>Pregunta ${qIndex + 1}:</strong> ${ok ? 'Correcta' : 'Revisar'}. ${question.explicacion}</li>`;
          });
          const score = Math.round((correct / quiz.preguntas.length) * 100);
          progress.quizResults[`u${unitId}`] = { score, date: new Date().toISOString() };
          progress.checks[`u${unitId}_quiz`] = true;
          saveProgress();
          const feedback = document.getElementById(`quizFeedback${unitId}`);
          feedback.className = 'quiz-feedback visible';
          feedback.innerHTML = `
            <h3>Resultado: ${score}%</h3>
            <p>${score >= 70 ? 'Buen avance. Puedes continuar con la siguiente unidad.' : 'Conviene repasar el material y volver a intentar.'}</p>
            <ul>${explanations.join('')}</ul>
          `;
          document.getElementById(`quizCard${unitId}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      } catch (error) {
        mount.innerHTML = '<div class="status-box error">No se pudo cargar el cuestionario. Revisa la conexión o los archivos JSON.</div>';
      }
    }

    function renderLab() {
      const script = `# Script base del curso R aplicado a la salud
install.packages(c("tidyverse", "janitor", "gtsummary", "broom"))

library(tidyverse)
library(janitor)
library(broom)

salud <- read.csv("data/datasets/salud_muestra.csv")
glimpse(salud)

salud <- salud |>
  mutate(
    sexo = factor(sexo),
    diagnostico = factor(diagnostico),
    tabaquismo = factor(tabaquismo),
    diabetes_probable = diagnostico == "Diabetes probable"
  )

salud |>
  group_by(diagnostico) |>
  summarise(
    n = n(),
    edad_media = mean(edad),
    glucosa_media = mean(glucosa_mg_dl),
    .groups = "drop"
  )

ggplot(salud, aes(x = diagnostico, y = glucosa_mg_dl, fill = diagnostico)) +
  geom_boxplot(show.legend = FALSE) +
  labs(x = "Diagnóstico", y = "Glucosa (mg/dl)", title = "Glucosa por diagnóstico") +
  theme_minimal()

modelo <- glm(diabetes_probable ~ edad + imc + tabaquismo, data = salud, family = binomial)
tidy(modelo, exponentiate = TRUE, conf.int = TRUE)`;

      document.getElementById('laboratorio').innerHTML = `
        <div class="grid two">
          <div class="panel">
            <h2>Laboratorio R</h2>
            <p>Abre RStudio, crea un proyecto y copia este script para empezar. El dataset está disponible dentro del aula y también puede descargarse.</p>

            </div>
          </div>
          <div class="panel">
            <h2>Paquetes base</h2>
            <p>El curso usa principalmente <code>tidyverse</code>, <code>janitor</code>, <code>gtsummary</code> y <code>broom</code>. Todo el análisis está planteado en R.</p>
          </div>
        </div>
        <div class="code-block">
          <button class="btn small warn" type="button" onclick="copyCode(this)">Copiar</button>
          <pre><code>${escapeHtml(script)}</code></pre>
        </div>
      `;
    }

            <div class="form-field">
              <label for="rpubsUrl">URL publicada</label>
              <input id="rpubsUrl" placeholder="https://rpubs.com/usuario/reporte" value="${escapeHtml(progress.rpubsUrl || '')}">
            </div>
            <button class="btn small" type="button" id="saveRpubs">Guardar enlace</button>
            <p class="footer-note">Referencia inspiradora: <a href="${COURSE.rpubsReference}" target="_blank" rel="noopener">Inferencia Estadística con R</a>.</p>
          </div>
        </div>
      `;
      document.getElementById('saveRpubs').addEventListener('click', () => {
        progress.rpubsUrl = document.getElementById('rpubsUrl').value.trim();
        saveProgress();
      });
    }

    function renderProgress() {
      const total = percentComplete();
      const rows = COURSE.units.map(unit => {
        const items = ['material', 'actividad', 'tarea', 'quiz'];
        const done = items.filter(item => progress.checks[`u${unit.id}_${item}`]).length;
        const quiz = progress.quizResults[`u${unit.id}`];
        return `
          <tr>
            <td>Unidad ${unit.id}</td>
            <td>${unit.title}</td>
            <td>${done}/4</td>
            <td>${quiz ? `${quiz.score}%` : 'Pendiente'}</td>
          </tr>
        `;
      }).join('');

      document.getElementById('progreso').innerHTML = `
        <div class="panel">
          <h2>Avance local: ${total}%</h2>
          <div class="progress-bar"><div class="progress-fill" style="width:${total}%"></div></div>
          <p class="footer-note">Este avance queda guardado solamente en este navegador.</p>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Unidad</th><th>Tema</th><th>Checklist</th><th>Quiz</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderAdmin() {
      document.getElementById('administracion').innerHTML = `
        <div class="grid two">
          <div class="admin-box">
            <h2>Resumen técnico</h2>
            <p>Versión: ${COURSE.version}</p>
            <p>Repositorio: <a href="${COURSE.repo}" target="_blank" rel="noopener">${COURSE.repo}</a></p>
            <p>GitHub Pages esperado: <a href="${COURSE.pages}" target="_blank" rel="noopener">${COURSE.pages}</a></p>
          </div>
          <div class="admin-box">
            <h2>Exportar progreso</h2>
            <p>Descarga un JSON local para revisar avance del usuario actual.</p>
            <button class="btn small" type="button" onclick="downloadProgress()">Descargar JSON</button>
            <button class="btn small secondary" type="button" onclick="resetProgress()">Reiniciar progreso</button>
          </div>
        </div>
      `;
    }

    function renderHelp() {
      document.getElementById('ayuda').innerHTML = `
        <div class="grid two">
          <div class="panel">
            <h2>Documentación</h2>
            <div class="resource-row">
              <div><strong>Manual de usuario</strong><p>Uso del aula, login, progreso y publicación.</p></div>
              <a class="btn small secondary" href="docs/manual_usuario.md">Abrir</a>
            </div>
            <div class="resource-row">
              <div><strong>Manual técnico</strong><p>Estructura de archivos y publicación en GitHub Pages.</p></div>
              <a class="btn small secondary" href="docs/manual_tecnico.md">Abrir</a>
            </div>
            <div class="resource-row">
              <div><strong>Diccionario de datos</strong><p>Variables del dataset ficticio de salud.</p></div>
              <a class="btn small secondary" href="docs/diccionario_datos.md">Abrir</a>
            </div>
          </div>
          <div class="panel">
            <h2>Problemas comunes</h2>
            <ul>
              <li>Si el login falla, prueba <code>estudiante</code> / <code>r-salud</code>.</li>
              <li>Si no carga un quiz, verifica que el archivo JSON esté publicado.</li>
              <li>Si RPubs no publica, revisa que el reporte HTML haya sido generado desde RStudio.</li>
              <li>Si el avance desaparece, probablemente se borró el almacenamiento local del navegador.</li>
            </ul>
          </div>
        </div>
      `;
    }

    function copyCode(button) {
      const code = button.parentElement.querySelector('code').innerText;
      navigator.clipboard.writeText(code).then(() => {
        button.textContent = 'Copiado';
        setTimeout(() => button.textContent = 'Copiar', 1400);
      });
    }

    function downloadProgress() {
      const blob = new Blob([JSON.stringify(progress, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `progreso_${session.usuario}.json`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function resetProgress() {
      if (!confirm('¿Reiniciar el progreso local de este usuario?')) return;
      progress = { ...defaultProgress };
      saveProgress();
      renderAll();
    }

    function renderAll() {
      renderHome();
      renderRoute();
      renderUnits();
      renderActivities();
      renderQuizzes();
      renderLab();
      renderProject();
      renderProgress();
      renderAdmin();
      renderHelp();
      renderStats();
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('rSaludSession');
      window.location.href = 'index.html';
    });

    document.getElementById('userLabel').textContent = `${session.nombre} · ${session.rol}`;
    initNavigation();
    renderAll();
    showSection(location.hash?.replace('#', '') || 'inicio');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
