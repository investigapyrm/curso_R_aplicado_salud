<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reiniciar acceso | R aplicado a la salud</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7f6;
      color: #1f2937;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(520px, 100%);
      background: #ffffff;
      border: 1px solid #dbe7e0;
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      padding: 28px;
    }
    h1 {
      margin: 0 0 10px;
      color: #0b5d3b;
      font-size: 1.5rem;
    }
    p {
      margin: 0 0 16px;
      line-height: 1.55;
    }
    code {
      background: #e8f3ee;
      border-radius: 6px;
      padding: 2px 6px;
      font-weight: 700;
    }
    .status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      font-size: 0.95rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      background: #0b5d3b;
      color: white;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Acceso reiniciado</h1>
    <p>Se está limpiando la versión anterior del aula para abrir el login nuevo.</p>
    <p>En la nueva pantalla podés crear tu cuenta personal o ingresar con tu usuario.</p>
    <a class="btn" id="continueLink" href="index.html?reset=20260527-10">Entrar al aula</a>
    <div class="status" id="status">Preparando acceso...</div>
  </main>

  <script>
    const statusBox = document.getElementById('status');
    const nextUrl = 'index.html?reset=20260527-10';

    async function clearOldAccess() {
      try {
        sessionStorage.removeItem('abd_user');
        sessionStorage.removeItem('rSaludSession');
        localStorage.removeItem('rSaludLastUser');

        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }

        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }

        statusBox.textContent = 'Listo. Abriendo el login nuevo...';
        window.location.replace(nextUrl);
      } catch (error) {
        statusBox.textContent = 'No se pudo limpiar todo automáticamente. Tocá "Entrar al aula".';
      }
    }

    clearOldAccess();
  </script>
</body>
</html>
