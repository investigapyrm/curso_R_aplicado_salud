      <h1>Unidad 6 · Inferencia basica con R</h1>
      <figure class="doc-figure hero">
        <img src="../../recursos/imagenes/unidad6/u6_hero.webp" alt="Balanza comparando dos grupos clinicos, con un intervalo de confianza sobre ellos." loading="lazy">
        <figcaption>Inferir es comparar grupos y declarar la incertidumbre de la estimacion.</figcaption>
      </figure>

      <h2>Hipotesis, p-valor e IC95%</h2>
      <figure class="doc-figure">
        <img src="../../recursos/imagenes/unidad6/u6_concepto_1.webp" alt="Linea numerica con punto estimado y su intervalo de confianza al 95 por ciento respecto al valor nulo." loading="lazy">
        <figcaption>El intervalo de confianza cuenta mas historia que un p-valor aislado.</figcaption>
      </figure>
      <div class="code-block"><pre><code>t.test(glucosa_mg_dl ~ tabaquismo, data = salud)</code></pre></div>

      <h2>Selector de pruebas</h2>
      <figure class="doc-figure">
        <img src="../../recursos/imagenes/unidad6/u6_concepto_2.webp" alt="Arbol de decision visual: t de Student, Wilcoxon o chi-cuadrado segun el tipo de variable." loading="lazy">
        <figcaption>La prueba depende del tipo de variable, la pregunta y los supuestos razonables.</figcaption>
      </figure>
      <div class="code-block"><pre><code>tabla <- table(salud$tabaquismo, salud$diagnostico)
chisq.test(tabla)

cor.test(salud$edad, salud$glucosa_mg_dl, method = "spearman")</code></pre></div>
